<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      
        <div class="screen active" id="start-screen">
        <h1>Quiz Time!!!</h1>
        <p>Test your knowledge with this fun questions</p>
        <button id="start-quiz">Start Quiz</button>
        </div>

        
<div class="screen " id="quize-screen">
<div class="quiz-header">
<h2 id="question-title"></h2>
 <div class="quiz-info">
        <p>Question <span id="current-question">1</span> of <span id="total-questions">5</span></p>
        <p>Score: <span id="score">0</span></p>
        </div>
        <div class="answer-container" id="answer-container">

 <div id="answer-buttons">
   
 </div>


        </div>
            <div class="progress-bar">
    <div class="progress" id="progress"></div>
    </div>
        </div>
             
     
 

</div>



       

<div class="screen " id="result-screen">

    <h1> QUIZ RESULTS</h1>
<div class="result-info">
<p>Your Score: <span id="final-score">0</span> out of <span id="max-scrore">0</span></p>
<div class="result-message" id="result-message">
    Good job! You did well.
</div>

</div>
<button id="restart-quiz">
    Restart Quiz
</button>

</div>


</div>
<script src="qapp.js"></script>
 </body>
</html>
